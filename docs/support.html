  <h1>支持与数据边界</h1>
  <section>
    <h2>使用问题</h2>
    <p>先确认通过本地 HTTP 服务访问项目，并执行 <code>npm run test:quality</code>。问题报告应包含页面路径、复现步骤、浏览器版本和控制台错误。</p>
  </section>
  <section>
    <h2>本地数据</h2>
    <p>工具数据保存在当前浏览器的 localStorage。清理站点数据会删除草稿；跨设备前应使用工具栏导出项目 JSON。不要导入来源不明的文件。</p>
  </section>
  <section>
    <h2>发布边界</h2>
    <p>本目录的通过结果只证明本地候选版本通过对应检查，不代表已部署或线上可用。</p>
  </section>
