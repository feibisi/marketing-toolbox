<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蓝海战略画布 (Blue Ocean Strategy)</title>
    <!-- Fonts -->


    <!-- Styles -->
    <link rel="stylesheet" href="../shared/css/tokens.css">
    <link rel="stylesheet" href="../shared/css/base.css">
    <link rel="stylesheet" href="../shared/css/components.css">
    <link rel="stylesheet" href="../shared/css/canvas.css">
    <link rel="stylesheet" href="assets/css/blue-ocean.css">

    <!-- Icons -->
    <script src="../shared/vendor/lucide.min.js"></script>
</head>

<body>
    <div class="desk-background"></div>

    <main class="paper-a3">
        <!-- Header -->
        <header class="canvas-header">
            <div class="title-group">
                <h1>蓝海战略画布</h1>
                <span class="english-subtitle">Blue Ocean Strategy Canvas & ERRC Grid</span>
            </div>
            <div class="meta-info">
                <div class="meta-group">
                    <label>行业/市场</label>
                    <input type="text" class="meta-input" placeholder="e.g. Budget Airlines" aria-label="Budget Airlines">
                </div>
            </div>
        </header>

        <div class="ocean-container">

            <!-- 1. Value Curves -->
            <div class="chart-card">
                <span class="y-axis-label">Offering Level (Low -> High)</span>

                <div class="chart-header">
                    <div class="chart-title">
                        <i data-lucide="activity" style="width:16px;"></i> 价值曲线 (Value Curves)
                    </div>
                    <div class="legend">
                        <div class="legend-item"><span class="dot dot-industry"></span> 行业标准</div>
                        <div class="legend-item"><span class="dot dot-innovation"></span> 我们的创新</div>
                    </div>
                </div>

                <div class="canvas-wrapper">
                    <svg id="valueCurve" viewBox="0 0 800 300" preserveAspectRatio="none">
                        <!-- Grid Lines -->
                        <line x1="0" y1="75" x2="800" y2="75" stroke="var(--border-sem-inner)" stroke-dasharray="4" />
                        <line x1="0" y1="150" x2="800" y2="150" stroke="var(--border-sem-inner)" stroke-dasharray="4" />
                        <line x1="0" y1="225" x2="800" y2="225" stroke="var(--border-sem-inner)" stroke-dasharray="4" />

                        <!-- Competitor Line (Static Example for print) -->
                        <polyline points="50,100 150,80 250,50 350,100 450,100 550,50 650,250 750,250"
                            class="line-industry" fill="none" stroke-width="2" />

                        <!-- My Curve (Static Example) -->
                        <polyline points="50,250 150,250 250,200 350,250 450,50 550,50 650,50 750,20"
                            class="line-innovation" fill="none" stroke-width="3" />

                        <!-- Dots (Interactive in JS version, static here) -->
                        <circle cx="50" cy="250" r="4" class="curve-point dot-innovation" />
                        <circle cx="150" cy="250" r="4" class="curve-point dot-innovation" />
                        <circle cx="250" cy="200" r="4" class="curve-point dot-innovation" />
                        <circle cx="350" cy="250" r="4" class="curve-point dot-innovation" />
                        <circle cx="450" cy="50" r="4" class="curve-point dot-innovation" />
                        <circle cx="550" cy="50" r="4" class="curve-point dot-innovation" />
                        <circle cx="650" cy="50" r="4" class="curve-point dot-innovation" />
                        <circle cx="750" cy="20" r="4" class="curve-point dot-innovation" />
                    </svg>
                </div>

                <div class="x-axis-row">
                    <input class="factor-input" value="Price" aria-label="Input field">
                    <input class="factor-input" value="Service" aria-label="Input field">
                    <input class="factor-input" value="Quality" aria-label="Input field">
                    <input class="factor-input" value="Speed" aria-label="Input field">
                    <input class="factor-input" value="Feature X" aria-label="Input field">
                    <input class="factor-input" value="Feature Y" aria-label="Input field">
                    <input class="factor-input" value="Ease" aria-label="Input field">
                    <input class="factor-input" value="Support" aria-label="Input field">
                </div>
            </div>

            <!-- 2. ERRC Grid -->
            <div class="errc-grid">

                <div class="errc-card errc-eliminate">
                    <div class="errc-header">
                        <i data-lucide="trash-2" style="width:14px;"></i> 剔除 (Eliminate)
                    </div>
                    <textarea class="errc-content"
                        placeholder="Which factors that the industry takes for granted should be eliminated?" aria-label="Which factors that the industry takes for granted should be eliminated?"></textarea>
                </div>

                <div class="errc-card errc-reduce">
                    <div class="errc-header">
                        <i data-lucide="arrow-down" style="width:14px;"></i> 减少 (Reduce)
                    </div>
                    <textarea class="errc-content"
                        placeholder="Which factors should be reduced well below the industry's standard?" aria-label="Which factors should be reduced well below the industry&#x27;s standard?"></textarea>
                </div>

                <div class="errc-card errc-raise">
                    <div class="errc-header">
                        <i data-lucide="arrow-up" style="width:14px;"></i> 增加 (Raise)
                    </div>
                    <textarea class="errc-content"
                        placeholder="Which factors should be raised well above the industry's standard?" aria-label="Which factors should be raised well above the industry&#x27;s standard?"></textarea>
                </div>

                <div class="errc-card errc-create">
                    <div class="errc-header">
                        <i data-lucide="plus-circle" style="width:14px;"></i> 创造 (Create)
                    </div>
                    <textarea class="errc-content"
                        placeholder="Which factors should be created that the industry has never offered?" aria-label="Which factors should be created that the industry has never offered?"></textarea>
                </div>

            </div>

        </div>
        <footer class="modiqi-footer">
            <img src="../shared/images/modiqi-logo-r.png" alt="Modiqi Logo" class="footer-logo"
                title="点击隐藏/显示工具栏 (Toggle Toolbar)">
            <div class="copyright">Modiqi Digital Strategy Workbench &copy; 2026</div>
        </footer>
    </main>

    <!-- Scripts -->
    <script src="../shared/js/core.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            new ModiqiApp('blue_ocean');
            lucide.createIcons();
        });
    </script>
</body>

</html>
