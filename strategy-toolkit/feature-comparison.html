<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>功能对比矩阵 (Feature Comparison Matrix)</title>
    <meta name="description" content="功能对比矩阵工具，帮助您系统化对比产品功能、价格和服务，制定竞争策略。">
    <meta name="keywords" content="功能对比,竞品分析,产品对比,特性矩阵,竞争分析">

    <!-- Open Graph -->
    <meta property="og:title" content="功能对比矩阵 - Modiqi Workbench">
    <meta property="og:description" content="系统化对比产品功能、价格和服务，制定竞争策略。">
    <meta property="og:image" content="../shared/images/modiqi-logo-r.png">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/png" href="../shared/images/modiqi-logo-r.png">

    <!-- Fonts -->

    <!-- Styles: Modiqi Design System -->
    <link rel="stylesheet" href="../shared/css/tokens.css">
    <link rel="stylesheet" href="../shared/css/base.css">
    <link rel="stylesheet" href="../shared/css/components.css">
    <link rel="stylesheet" href="../shared/css/canvas.css">
    <link rel="stylesheet" href="assets/css/feature-comparison.css">

    <!-- Icons -->
    <script src="../shared/vendor/lucide.min.js"></script>
</head>

<body>
    <div class="desk-background"></div>

    <main class="paper-a3">
        <!-- Canvas Header -->
        <header class="canvas-header">
            <div class="title-group">
                <h1>功能对比矩阵</h1>
                <span class="english-subtitle">Feature Comparison Matrix</span>
            </div>
            <div class="meta-info">
                <div class="meta-group">
                    <label>日期 <span class="en-sub">(Date)</span></label>
                    <input type="date" class="meta-input" data-save-key="meta_date" aria-label="date">
                </div>
            </div>
        </header>

        <!-- Comparison Matrix -->
        <div class="comparison-container">
            <button class="btn-add-competitor" title="添加竞品列" type="button">
                <i data-lucide="plus-circle"></i>
            </button>

            <table class="comparison-matrix">
                <thead>
                    <tr>
                        <th class="col-feature">功能特性</th>
                        <th class="col-competitor us">
                            <div class="competitor-header">
                                <span class="badge us-badge">我们</span>
                                <span class="name" contenteditable="true" data-save-key="comp_us_name">我们的产品</span>
                                <span class="price" contenteditable="true" data-save-key="comp_us_price">¥299/月</span>
                            </div>
                        </th>
                        <th class="col-competitor">
                            <button class="btn-delete-col" title="删除此列" type="button">×</button>
                            <div class="competitor-header">
                                <span class="badge" contenteditable="true">竞品A</span>
                                <span class="name" contenteditable="true" data-save-key="comp_a_name">市场领导者</span>
                                <span class="price" contenteditable="true" data-save-key="comp_a_price">¥599/月</span>
                            </div>
                        </th>
                        <th class="col-competitor">
                            <button class="btn-delete-col" title="删除此列" type="button">×</button>
                            <div class="competitor-header">
                                <span class="badge" contenteditable="true">竞品B</span>
                                <span class="name" contenteditable="true" data-save-key="comp_b_name">挑战者</span>
                                <span class="price" contenteditable="true" data-save-key="comp_b_price">¥399/月</span>
                            </div>
                        </th>
                        <th class="col-competitor">
                            <button class="btn-delete-col" title="删除此列" type="button">×</button>
                            <div class="competitor-header">
                                <span class="badge" contenteditable="true">竞品C</span>
                                <span class="name" contenteditable="true" data-save-key="comp_c_name">细分玩家</span>
                                <span class="price" contenteditable="true" data-save-key="comp_c_price">¥199/月</span>
                            </div>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Core Features -->
                    <tr class="category-row">
                        <td colspan="5" class="category-header">
                            <i data-lucide="box"></i>
                            <span>核心功能</span>
                        </td>
                    </tr>
                    <tr>
                        <td class="feature-name" contenteditable="true">用户管理</td>
                        <td class="support full"><i data-lucide="check-circle"></i></td>
                        <td class="support full"><i data-lucide="check-circle"></i></td>
                        <td class="support full"><i data-lucide="check-circle"></i></td>
                        <td class="support partial"><i data-lucide="minus-circle"></i></td>
                    </tr>
                    <tr>
                        <td class="feature-name" contenteditable="true">权限控制</td>
                        <td class="support full"><i data-lucide="check-circle"></i></td>
                        <td class="support full"><i data-lucide="check-circle"></i></td>
                        <td class="support partial"><i data-lucide="minus-circle"></i></td>
                        <td class="support none"><i data-lucide="x-circle"></i></td>
                    </tr>
                    <tr>
                        <td class="feature-name" contenteditable="true">数据导入导出</td>
                        <td class="support full"><i data-lucide="check-circle"></i></td>
                        <td class="support full"><i data-lucide="check-circle"></i></td>
                        <td class="support full"><i data-lucide="check-circle"></i></td>
                        <td class="support full"><i data-lucide="check-circle"></i></td>
                    </tr>

                    <!-- Advanced Features -->
                    <tr class="category-row">
                        <td colspan="5" class="category-header">
                            <i data-lucide="zap"></i>
                            <span>高级功能</span>
                        </td>
                    </tr>
                    <tr>
                        <td class="feature-name" contenteditable="true">AI智能分析</td>
                        <td class="support full"><i data-lucide="check-circle"></i></td>
                        <td class="support partial"><i data-lucide="minus-circle"></i></td>
                        <td class="support none"><i data-lucide="x-circle"></i></td>
                        <td class="support none"><i data-lucide="x-circle"></i></td>
                    </tr>
                    <tr>
                        <td class="feature-name" contenteditable="true">自动化工作流</td>
                        <td class="support full"><i data-lucide="check-circle"></i></td>
                        <td class="support full"><i data-lucide="check-circle"></i></td>
                        <td class="support partial"><i data-lucide="minus-circle"></i></td>
                        <td class="support none"><i data-lucide="x-circle"></i></td>
                    </tr>
                    <tr>
                        <td class="feature-name" contenteditable="true">自定义报表</td>
                        <td class="support full"><i data-lucide="check-circle"></i></td>
                        <td class="support full"><i data-lucide="check-circle"></i></td>
                        <td class="support full"><i data-lucide="check-circle"></i></td>
                        <td class="support partial"><i data-lucide="minus-circle"></i></td>
                    </tr>

                    <!-- Integration -->
                    <tr class="category-row">
                        <td colspan="5" class="category-header">
                            <i data-lucide="plug"></i>
                            <span>集成能力</span>
                        </td>
                    </tr>
                    <tr>
                        <td class="feature-name" contenteditable="true">API接口</td>
                        <td class="support full"><i data-lucide="check-circle"></i></td>
                        <td class="support full"><i data-lucide="check-circle"></i></td>
                        <td class="support full"><i data-lucide="check-circle"></i></td>
                        <td class="support partial"><i data-lucide="minus-circle"></i></td>
                    </tr>
                    <tr>
                        <td class="feature-name" contenteditable="true">第三方集成</td>
                        <td class="support full"><i data-lucide="check-circle"></i></td>
                        <td class="support full"><i data-lucide="check-circle"></i></td>
                        <td class="support partial"><i data-lucide="minus-circle"></i></td>
                        <td class="support partial"><i data-lucide="minus-circle"></i></td>
                    </tr>
                    <tr>
                        <td class="feature-name" contenteditable="true">Webhook支持</td>
                        <td class="support full"><i data-lucide="check-circle"></i></td>
                        <td class="support partial"><i data-lucide="minus-circle"></i></td>
                        <td class="support partial"><i data-lucide="minus-circle"></i></td>
                        <td class="support none"><i data-lucide="x-circle"></i></td>
                    </tr>

                    <!-- Support & Service -->
                    <tr class="category-row">
                        <td colspan="5" class="category-header">
                            <i data-lucide="headphones"></i>
                            <span>支持与服务</span>
                        </td>
                    </tr>
                    <tr>
                        <td class="feature-name" contenteditable="true">7×24小时支持</td>
                        <td class="support full"><i data-lucide="check-circle"></i></td>
                        <td class="support full"><i data-lucide="check-circle"></i></td>
                        <td class="support partial"><i data-lucide="minus-circle"></i></td>
                        <td class="support none"><i data-lucide="x-circle"></i></td>
                    </tr>
                    <tr>
                        <td class="feature-name" contenteditable="true">专属客户经理</td>
                        <td class="support partial"><i data-lucide="minus-circle"></i></td>
                        <td class="support full"><i data-lucide="check-circle"></i></td>
                        <td class="support partial"><i data-lucide="minus-circle"></i></td>
                        <td class="support none"><i data-lucide="x-circle"></i></td>
                    </tr>
                    <tr>
                        <td class="feature-name" contenteditable="true">培训服务</td>
                        <td class="support full"><i data-lucide="check-circle"></i></td>
                        <td class="support full"><i data-lucide="check-circle"></i></td>
                        <td class="support full"><i data-lucide="check-circle"></i></td>
                        <td class="support partial"><i data-lucide="minus-circle"></i></td>
                    </tr>

                    <!-- Overall Score -->
                    <tr class="score-row">
                        <td class="score-label">综合评分</td>
                        <td class="score-value us"><span class="score">9.2</span></td>
                        <td class="score-value"><span class="score">8.8</span></td>
                        <td class="score-value"><span class="score">7.5</span></td>
                        <td class="score-value"><span class="score">6.3</span></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Legend -->
        <div class="legend-section">
            <h3>图例说明</h3>
            <div class="legend-items">
                <div class="legend-item">
                    <i data-lucide="check-circle" class="icon-full"></i>
                    <span contenteditable="true" data-save-key="legend_full">完全支持</span>
                </div>
                <div class="legend-item">
                    <i data-lucide="minus-circle" class="icon-partial"></i>
                    <span contenteditable="true" data-save-key="legend_partial">部分支持</span>
                </div>
                <div class="legend-item">
                    <i data-lucide="x-circle" class="icon-none"></i>
                    <span contenteditable="true" data-save-key="legend_none">不支持</span>
                </div>
            </div>
        </div>

        <footer class="modiqi-footer">
            <img src="../shared/images/modiqi-logo-r.png" alt="Modiqi" class="footer-logo">
            <span>Modiqi Digital Marketing Workbench © 2026</span>
        </footer>
    </main>

    <script src="../shared/js/core.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            new ModiqiApp('feature_comparison_v1');
            lucide.createIcons({
                attrs: {
                    class: "icon",
                    'stroke-width': 2
                }
            });

            // 初始化动态功能
            initDynamicMatrix();

            // 单元格状态切换逻辑
            document.querySelectorAll('.support').forEach(cell => {
                cell.style.cursor = 'pointer';
                cell.title = "点击切换状态";

                cell.addEventListener('click', () => {
                    let currentState = 'none';
                    if (cell.classList.contains('full')) currentState = 'full';
                    else if (cell.classList.contains('partial')) currentState = 'partial';

                    let newState = 'full';
                    let newIcon = 'check-circle';

                    if (currentState === 'full') {
                        newState = 'partial';
                        newIcon = 'minus-circle';
                    } else if (currentState === 'partial') {
                        newState = 'none';
                        newIcon = 'x-circle';
                    }

                    cell.classList.remove('full', 'partial', 'none');
                    cell.classList.add(newState);
                    cell.innerHTML = `<i data-lucide="${newIcon}"></i>`;

                    lucide.createIcons({
                        attrs: {
                            class: "icon",
                            'stroke-width': 2
                        },
                        nameAttr: 'data-lucide'
                    });
                });
            });
        });

        function initDynamicMatrix() {
            const table = document.querySelector('.comparison-matrix');
            const tbody = table.querySelector('tbody');

            // 为所有类别行添加"添加功能"按钮
            document.querySelectorAll('.category-header').forEach(header => {
                if (!header.querySelector('.btn-add-feature')) {
                    const btn = document.createElement('button');
                    btn.className = 'btn-add-feature';
                    btn.title = '添加功能行';
                    btn.textContent = '+';
                    btn.onclick = () => addFeatureRow(header.closest('tr'));
                    header.appendChild(btn);
                }
            });

            // 为所有功能行添加删除按钮
            document.querySelectorAll('tbody tr:not(.category-row):not(.score-row)').forEach(row => {
                if (!row.querySelector('.action-cell')) {
                    const cell = document.createElement('td');
                    cell.className = 'action-cell';
                    const btn = document.createElement('button');
                    btn.className = 'btn-delete-row';
                    btn.title = '删除此行';
                    btn.textContent = '×';
                    btn.onclick = () => row.remove();
                    cell.appendChild(btn);
                    row.appendChild(cell);
                }
            });

            // 添加竞品按钮事件
            document.querySelector('.btn-add-competitor').onclick = addCompetitorColumn;
        }

        function addCompetitorColumn() {
            const table = document.querySelector('.comparison-matrix');
            const thead = table.querySelector('thead tr');
            const tbody = table.querySelector('tbody');
            const colCount = thead.querySelectorAll('th').length;

            // 添加表头
            const th = document.createElement('th');
            th.className = 'col-competitor';
            th.innerHTML = `
                <button class="btn-delete-col" title="删除此列" type="button">×</button>
                <div class="competitor-header">
                    <span class="badge" contenteditable="true">新竞品</span>
                    <span class="name" contenteditable="true">竞品名称</span>
                    <span class="price" contenteditable="true">¥0/月</span>
                </div>
            `;
            thead.appendChild(th);

            // 为删除按钮添加事件
            th.querySelector('.btn-delete-col').onclick = () => deleteCompetitorColumn(th);

            // 为所有行添加新单元格
            tbody.querySelectorAll('tr').forEach(row => {
                if (row.classList.contains('category-row')) {
                    // 更新 colspan
                    const header = row.querySelector('.category-header');
                    header.colSpan = colCount + 1;
                } else if (row.classList.contains('score-row')) {
                    // 添加评分单元格
                    const td = document.createElement('td');
                    td.className = 'score-value';
                    td.innerHTML = '<span class="score" contenteditable="true">0.0</span>';
                    row.insertBefore(td, row.querySelector('.action-cell'));
                } else {
                    // 添加支持状态单元格
                    const td = document.createElement('td');
                    td.className = 'support none';
                    td.innerHTML = '<i data-lucide="x-circle"></i>';
                    td.style.cursor = 'pointer';
                    td.title = "点击切换状态";
                    td.onclick = function() {
                        let currentState = 'none';
                        if (this.classList.contains('full')) currentState = 'full';
                        else if (this.classList.contains('partial')) currentState = 'partial';

                        let newState = 'full';
                        let newIcon = 'check-circle';

                        if (currentState === 'full') {
                            newState = 'partial';
                            newIcon = 'minus-circle';
                        } else if (currentState === 'partial') {
                            newState = 'none';
                            newIcon = 'x-circle';
                        }

                        this.classList.remove('full', 'partial', 'none');
                        this.classList.add(newState);
                        this.innerHTML = `<i data-lucide="${newIcon}"></i>`;
                        lucide.createIcons({
                            attrs: { class: "icon", 'stroke-width': 2 },
                            nameAttr: 'data-lucide'
                        });
                    };
                    row.insertBefore(td, row.querySelector('.action-cell'));
                }
            });

            lucide.createIcons({
                attrs: { class: "icon", 'stroke-width': 2 },
                nameAttr: 'data-lucide'
            });
        }

        function deleteCompetitorColumn(th) {
            const table = document.querySelector('.comparison-matrix');
            const thead = table.querySelector('thead tr');
            const tbody = table.querySelector('tbody');
            const colIndex = Array.from(thead.children).indexOf(th);

            // 删除表头
            th.remove();

            // 删除所有行的对应单元格
            tbody.querySelectorAll('tr').forEach(row => {
                if (row.classList.contains('category-row')) {
                    // 更新 colspan
                    const header = row.querySelector('.category-header');
                    header.colSpan = parseInt(header.colSpan) - 1;
                } else {
                    const cells = row.querySelectorAll('td:not(.action-cell)');
                    if (cells[colIndex - 1]) {
                        cells[colIndex - 1].remove();
                    }
                }
            });
        }

        function addFeatureRow(categoryRow) {
            const table = document.querySelector('.comparison-matrix');
            const thead = table.querySelector('thead tr');
            const colCount = thead.querySelectorAll('th').length;

            const newRow = document.createElement('tr');

            // 功能名称单元格
            const nameCell = document.createElement('td');
            nameCell.className = 'feature-name';
            nameCell.contentEditable = 'true';
            nameCell.textContent = '新功能';
            newRow.appendChild(nameCell);

            // 支持状态单元格
            for (let i = 1; i < colCount; i++) {
                const td = document.createElement('td');
                td.className = 'support none';
                td.innerHTML = '<i data-lucide="x-circle"></i>';
                td.style.cursor = 'pointer';
                td.title = "点击切换状态";
                td.onclick = function() {
                    let currentState = 'none';
                    if (this.classList.contains('full')) currentState = 'full';
                    else if (this.classList.contains('partial')) currentState = 'partial';

                    let newState = 'full';
                    let newIcon = 'check-circle';

                    if (currentState === 'full') {
                        newState = 'partial';
                        newIcon = 'minus-circle';
                    } else if (currentState === 'partial') {
                        newState = 'none';
                        newIcon = 'x-circle';
                    }

                    this.classList.remove('full', 'partial', 'none');
                    this.classList.add(newState);
                    this.innerHTML = `<i data-lucide="${newIcon}"></i>`;
                    lucide.createIcons({
                        attrs: { class: "icon", 'stroke-width': 2 },
                        nameAttr: 'data-lucide'
                    });
                };
                newRow.appendChild(td);
            }

            // 删除按钮单元格
            const actionCell = document.createElement('td');
            actionCell.className = 'action-cell';
            const btn = document.createElement('button');
            btn.className = 'btn-delete-row';
            btn.title = '删除此行';
            btn.textContent = '×';
            btn.onclick = () => newRow.remove();
            actionCell.appendChild(btn);
            newRow.appendChild(actionCell);

            // 插入到类别行后面
            categoryRow.parentNode.insertBefore(newRow, categoryRow.nextSibling);

            lucide.createIcons({
                attrs: { class: "icon", 'stroke-width': 2 },
                nameAttr: 'data-lucide'
            });
        }
    </script>
</body>

</html>
