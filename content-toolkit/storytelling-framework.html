<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>故事叙事框架 (Storytelling Framework)</title>
    <!-- Fonts -->

    <!-- Styles -->
    <link rel="stylesheet" href="../shared/css/tokens.css">
    <link rel="stylesheet" href="../shared/css/base.css">
    <link rel="stylesheet" href="../shared/css/components.css">
    <link rel="stylesheet" href="../shared/css/canvas.css">
    <link rel="stylesheet" href="assets/css/storytelling-framework.css">

    <!-- Icons -->
    <script src="../shared/vendor/lucide.min.js"></script>
</head>

<body>
    <div class="desk-background"></div>

    <main class="paper-a3">
        <!-- Header -->
        <header class="canvas-header">
            <div class="title-group">
                <h1>故事叙事框架</h1>
                <span class="english-subtitle">The Hero's Journey Framework</span>
            </div>
            <div class="meta-info">
                <div class="meta-group">
                    <label>故事名称 <span class="en-sub">(Story Title)</span></label>
                    <input type="text" class="meta-input" placeholder="例如: 品牌起源故事" data-save-key="story_title" aria-label="品牌起源故事">
                </div>
                <div class="meta-group">
                    <label>主角 <span class="en-sub">(Hero)</span></label>
                    <input type="text" class="meta-input" placeholder="例如: 我们的客户" data-save-key="hero_name" aria-label="我们的客户">
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="hero-container">

            <!-- Visualization Cycle -->
            <div class="cycle-section">
                <svg class="cycle-svg" viewBox="0 0 600 600">
                    <!-- Definitions -->
                    <defs>
                        <!-- Glow filters -->
                        <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="3" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>

                    <!-- Background Circle Guide -->
                    <circle cx="300" cy="300" r="220" fill="none" stroke="#f1f5f9" stroke-width="40" />

                    <!-- Sector Arcs -->
                    <!-- Zone 1: Departure (Steps 1-4) approx -15 to 105 deg -->
                    <!-- Path: M cx cy + polar to cartesian logic -->
                    <!-- Using simpler path overlay -->
                    <path d="M 300,80 A 220,220 0 0,1 512,356" fill="none" class="stage-path stage-departure" />

                    <!-- Zone 2: Initiation (Steps 5-8) approx 105 to 225 deg -->
                    <path d="M 512,356 A 220,220 0 0,1 144,456" fill="none" class="stage-path stage-initiation" />

                    <!-- Zone 3: Return (Steps 9-12) approx 225 to 345 deg -->
                    <path d="M 144,456 A 220,220 0 0,1 300,80" fill="none" class="stage-path stage-return" />

                    <!-- Stage Labels (Inner) -->
                    <text x="300" y="220" text-anchor="middle" font-size="14" fill="#64748b"
                        font-weight="bold">DEPARTURE</text>
                    <text x="300" y="380" text-anchor="middle" font-size="14" fill="#64748b"
                        font-weight="bold">INITIATION</text>
                    <text x="220" y="300" text-anchor="middle" font-size="14" fill="#64748b" font-weight="bold"
                        transform="rotate(-60 220,300)">RETURN</text>

                    <!-- Steps Markers -->
                    <!-- Generated via JS for cleaner code or hardcoded below -->
                    <g id="steps-group"></g>

                    <!-- Center Icon/Logo -->
                    <circle cx="300" cy="300" r="40" fill="#fff" stroke="#e2e8f0" stroke-width="2" />
                    <text x="300" y="305" text-anchor="middle" font-size="24">✨</text>
                </svg>
            </div>

            <!-- Editor Panel -->
            <div class="editor-section">
                <div class="editor-header">
                    <div class="current-step-label" id="step-label">STEP 1</div>
                    <div class="current-step-title" id="step-title">平凡世界 (Ordinary World)</div>
                </div>

                <div class="editor-content">
                    <div class="step-description" id="step-desc">
                        这是英雄开始旅程前的正常生活状态。对于品牌来说，这代表客户目前的现状和未被满足的需求。
                    </div>
                    <textarea class="script-input" id="script-input" placeholder="在此撰写故事脚本..."
                        spellcheck="false" aria-label="在此撰写故事脚本..."></textarea>
                </div>

                <div class="nav-buttons">
                    <button class="nav-btn" id="prev-btn" onclick="changeStep(-1)" type="button">
                        <i data-lucide="arrow-left" class="icon"></i> 上一步
                    </button>
                    <button class="nav-btn" id="next-btn" onclick="changeStep(1)" type="button">
                        下一步 <i data-lucide="arrow-right" class="icon"></i>
                    </button>
                </div>
            </div>
        </div>
        <!-- Footer -->
        <footer class="modiqi-footer">
            <img src="../shared/images/modiqi-logo-r.png" alt="Modiqi" class="footer-logo">
            <span>Modiqi Digital Marketing Workbench © 2026</span>
        </footer>

    </main>

    <!-- Scripts -->
    <script src="../shared/js/core.js"></script>
    <script>
        // Hero's Journey Data
        const journeySteps = [
            {
                id: 1,
                title: "平凡世界 (Ordinary World)",
                desc: "英雄目前的日常生活，充满了未被察觉的问题或潜在的焦虑。对应客户当前的痛点。",
                angle: -90 // 12 o'clock
            },
            {
                id: 2,
                title: "冒险召唤 (Call to Adventure)",
                desc: "发生了一件事，打破了平静。英雄意识到必须做出改变。对应客户意识到问题的时刻。",
                angle: -60 // 1 o'clock
            },
            {
                id: 3,
                title: "拒绝召唤 (Refusal of the Call)",
                desc: "英雄感到恐惧或犹豫，试图逃避改变。对应客户的疑虑、预算担忧或惯性。",
                angle: -30 // 2 o'clock
            },
            {
                id: 4,
                title: "遇见导师 (Meeting the Mentor)",
                desc: "英雄遇到了引导者（你的品牌），获得了建议、工具或信心。对应品牌介入提供方案。",
                angle: 0 // 3 o'clock right
            },
            {
                id: 5,
                title: "跨越门槛 (Crossing the Threshold)",
                desc: "英雄真正踏上旅程，离开舒适区。对应客户决定购买或开始试用。",
                angle: 30 // 4 o'clock
            },
            {
                id: 6,
                title: "试炼、盟友与敌人 (Tests, Allies, Enemies)",
                desc: "英雄在适应新世界的过程中面临挑战。对应实施过程中的磨合与支持。",
                angle: 60 // 5 o'clock
            },
            {
                id: 7,
                title: "接近深渊 (Approach to the Inmost Cave)",
                desc: "英雄即将面对最大的挑战。对应项目实施的关键攻坚阶段。",
                angle: 90 // 6 o'clock bottom
            },
            {
                id: 8,
                title: "磨难 (Ordeal)",
                desc: "为了获得胜利，英雄必须面对死亡或极大的恐惧。对应解决最核心、最困难的问题。",
                angle: 120 // 7 o'clock
            },
            {
                id: 9,
                title: "奖赏 (Reward)",
                desc: "英雄战胜了磨难，获得了宝藏。对应客户解决了问题，获得了初步收益。",
                angle: 150 // 8 o'clock
            },
            {
                id: 10,
                title: "归路 (The Road Back)",
                desc: "英雄带着宝藏踏上归途，但仍面临最后考验。对应成果的稳固和内化。",
                angle: 180 // 9 o'clock left
            },
            {
                id: 11,
                title: "复活 (Resurrection)",
                desc: "英雄经历了最后的净化，脱胎换骨。对应客户业务的彻底转型或升级。",
                angle: 210 // 10 o'clock
            },
            {
                id: 12,
                title: "满载而归 (Return with the Elixir)",
                desc: "英雄回到平凡世界，但已通过宝藏改变了世界。对应长期价值和客户证言。",
                angle: 240 // 11 o'clock
            }
        ];

        let currentStepId = 1;

        document.addEventListener('DOMContentLoaded', () => {
            new ModiqiApp('storytelling_framework');
            lucide.createIcons({
                attrs: {
                    class: "icon",
                    'stroke-width': 2
                }
            });

            renderSteps();
            loadStep(1);

            // Input autosave
            const input = document.getElementById('script-input');
            input.addEventListener('input', () => {
                const key = `modiqi_story_step_${currentStepId}`;
                localStorage.setItem(key, input.value);
            });
        });

        function renderSteps() {
            const container = document.getElementById('steps-group');
            const cx = 300;
            const cy = 300;
            const r = 220;

            journeySteps.forEach(step => {
                // Convert degrees to radians. Subtract 90 degrees to start at 12 o'clock if angle implies clock
                // The data above has angle mapping:
                // 12 -> -90 deg (standard math 0 is 3 o'clock)

                const rad = step.angle * (Math.PI / 180);
                const x = cx + r * Math.cos(rad);
                const y = cy + r * Math.sin(rad);

                const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
                group.setAttribute("class", "step-marker");
                group.setAttribute("data-id", step.id);
                group.setAttribute("onclick", `loadStep(${step.id})`);

                // Circle
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                circle.setAttribute("cx", x);
                circle.setAttribute("cy", y);
                circle.setAttribute("r", "14");
                circle.setAttribute("class", "step-circle");
                group.appendChild(circle);

                // Text
                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute("x", x);
                text.setAttribute("y", y + 1); // Optical adjustment
                text.setAttribute("class", "step-text");
                text.textContent = step.id;
                group.appendChild(text);

                container.appendChild(group);
            });
        }

        function loadStep(id) {
            currentStepId = id;
            const step = journeySteps.find(s => s.id === id);

            // Update Text
            document.getElementById('step-label').textContent = `STEP ${step.id}`;
            document.getElementById('step-title').textContent = step.title;
            document.getElementById('step-desc').textContent = step.desc;

            // Update Active State Visuals
            document.querySelectorAll('.step-marker').forEach(el => {
                el.classList.toggle('active', parseInt(el.dataset.id) === id);
            });

            // Load saved content
            const key = `modiqi_story_step_${id}`;
            document.getElementById('script-input').value = localStorage.getItem(key) || '';

            // Focus input
            // document.getElementById('script-input').focus();
        }

        function changeStep(delta) {
            let newId = currentStepId + delta;
            if (newId > 12) newId = 1;
            if (newId < 1) newId = 12;
            loadStep(newId);
        }
    </script>
</body>

</html>
